<!-- Rain sound for swirl interaction -->
<audio id="rain-sound" loop preload="auto">
  <source src="rain01.m4a" type="audio/mp4">
</audio>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const rainAudio = document.getElementById('rain-sound');
  const swirlElement = document.querySelector('.natural-swirl');
  const leftLeaf = document.querySelector('.leaf-group[data-leaf="left"]');

  let isPlaying = false;

  if (swirlElement && leftLeaf && rainAudio) {
    // Set maximum safe volume (1.0 = 100%)
    rainAudio.volume = 1.0;

    // Click on swirl to play/pause
    swirlElement.addEventListener('click', function(e) {
      e.stopPropagation();
      console.log('🌀 Swirl clicked! Audio element:', !!rainAudio, 'Src:', rainAudio.src);

      if (!isPlaying) {
        const playPromise = rainAudio.play();

        if (playPromise !== undefined) {
          playPromise.then(() => {
            isPlaying = true;
            console.log('✅🌧️ Rain sound playing! Volume:', rainAudio.volume);
          }).catch(error => {
            console.error('❌ Play failed:', error.name, error.message);
            alert('无法播放音频：' + error.message);
          });
        }
      } else {
        rainAudio.pause();
        rainAudio.currentTime = 0;
        isPlaying = false;
        console.log('⏹️🌧️ Rain sound paused');
      }
    });

    // Stop when mouse leaves the leaf
    leftLeaf.addEventListener('mouseleave', function() {
      if (isPlaying) {
        rainAudio.pause();
        rainAudio.currentTime = 0;
        isPlaying = false;
        console.log('🖱️🌧️ Rain stopped - mouse left leaf');
      }
    });

    console.log('✅ Swirl audio ready | Element:', !!swirlElement, '| Leaf:', !!leftLeaf, '| Audio:', !!rainAudio);
  } else {
    console.error('❌ Missing elements:', {
      swirl: !!swirlElement,
      leaf: !!leftLeaf,
      audio: !!rainAudio
    });
  }
});
</script>
