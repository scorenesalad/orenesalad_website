<body>

          <!-- Bottom-left leaf - symmetrical heart shape without stroke overlap -->

          <!-- Bottom-right leaf - symmetrical heart shape without stroke overlap -->

  <!-- Main content -->
  <div class="main-content">
    <!-- Background decorative clovers removed - replaced with CSS gradient background -->
    
    <div class="clover-container">
      <!-- Three-leaf clover SVG -->
      <svg class="clover-svg" viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sketchy filter for hand-drawn feel -->
          <filter id="sketchy-filter" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="4" result="noise" seed="2"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <!-- Frosted glass filter for gummy candy star -->
          <filter id="star-frosted">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
            <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="2" result="noise"/>
            <feDisplacementMap in="blur" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <!-- Star glow filter -->
          <filter id="star-glow">
            <feGaussianBlur stdDeviation="4" result="glow"/>
            <feMerge>
              <feMergeNode in="glow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Stem (hand-drawn style with natural curve) -->
        <g class="stem sketchy">
          <path d="M200,270 Q195,310 198,350 Q202,390 195,420 Q190,440 186,448" 
                fill="none" stroke="#4dbf4d" stroke-width="5" stroke-linecap="round"/>
        </g>

        <!-- Top leaf - slightly wider natural heart shape -->
        <g class="leaf-group" data-leaf="top">
          <g class="leaf-wrapper">
            <path class="leaf sketchy" data-leaf-id="top"
              d="M200,270 C160,240 135,190 140,150 C143,120 160,95 180,90 C188,88 193,93 200,102 C207,93 212,88 220,90 C240,95 257,120 260,150 C265,190 240,240 200,270 Z"
              fill="#6dd66d" stroke="#4dbf4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Glowing dewdrop - appears on hover over top leaf -->
            <g class="dewdrop clickable-dewdrop" opacity="0" style="cursor: pointer;">
              <!-- Dewdrop body with gradient for transparency effect -->
              <defs>
                <radialGradient id="dewdrop-gradient" cx="40%" cy="35%" r="50%">
                  <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
                  <stop offset="50%" style="stop-color:#e0f7ff;stop-opacity:0.6" />
                  <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:0.4" />
                </radialGradient>
              </defs>
              <!-- Main drop shape -->
              <ellipse cx="220" cy="170" rx="14" ry="17" fill="url(#dewdrop-gradient)" stroke="#a3d9f5" stroke-width="1.5"/>
              <!-- Highlight/reflection -->
              <circle cx="215" cy="165" r="4" fill="#ffffff" opacity="0.9"/>
              <!-- Small secondary highlight -->
              <circle cx="224" cy="174" r="2" fill="#ffffff" opacity="0.6"/>
              <!-- Enter text -->
              <text x="220" y="174" text-anchor="middle" font-family="'Libertinus Math', serif" font-size="11" fill="#2c5f7a" font-weight="bold">Enter</text>
            </g>
          </g>
        </g>

        <!-- Bottom-left leaf - slightly wider natural heart shape (rotated 120 degrees) -->
        <g class="leaf-group" data-leaf="left" transform="rotate(120, 200, 270)">
          <g class="leaf-wrapper">
            <path class="leaf sketchy" data-leaf-id="left"
              d="M200,270 C160,240 135,190 140,150 C143,120 160,95 180,90 C188,88 193,93 200,102 C207,93 212,88 220,90 C240,95 257,120 260,150 C265,190 240,240 200,270 Z"
              fill="#6dd66d" stroke="#4dbf4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Gummy candy star - appears on hover over left leaf -->
            <g class="gummy-star" opacity="0" style="cursor: pointer;" transform="translate(225, 175)">
              <defs>
                <radialGradient id="star-gradient" cx="38%" cy="30%" r="55%">
                  <stop offset="0%" style="stop-color:#b8e8ff;stop-opacity:0.95" />
                  <stop offset="40%" style="stop-color:#7dcff5;stop-opacity:0.65" />
                  <stop offset="70%" style="stop-color:#4db8e8;stop-opacity:0.45" />
                  <stop offset="100%" style="stop-color:#2a99cc;stop-opacity:0.3" />
                </radialGradient>
                <radialGradient id="star-highlight" cx="40%" cy="30%" r="50%">
                  <stop offset="0%" style="stop-color:#e8f7ff;stop-opacity:0.8" />
                  <stop offset="100%" style="stop-color:#b8e8ff;stop-opacity:0.1" />
                </radialGradient>
              </defs>
              <!-- Outer glow -->
              <polygon points="0,-17 4,-7 16,-7 6.5,0.5 10,13 0,5.5 -10,13 -6.5,0.5 -16,-7 -4,-7"
                       fill="rgba(120,200,240,0.12)" filter="url(#star-glow)"/>
              <!-- Drop shadow for 3D depth -->
              <polygon points="0,-16 3.8,-6.5 15,-6.5 6,0.5 9.2,12.3 0,5 -9.2,12.3 -6,0.5 -15,-6.5 -3.8,-6.5"
                       fill="rgba(80,160,210,0.3)" transform="translate(1.5, 2.5)" filter="none"/>
              <!-- Main star body - gummy candy with frosted glass -->
              <polygon points="0,-16 3.8,-6.5 15,-6.5 6,0.5 9.2,12.3 0,5 -9.2,12.3 -6,0.5 -15,-6.5 -3.8,-6.5"
                       fill="url(#star-gradient)" stroke="rgba(200,235,255,0.5)" stroke-width="1.2" filter="url(#star-frosted)"/>
              <!-- Inner highlight layer for 3D gummy effect -->
              <polygon points="0,-12 2.8,-5 11,-5 4.5,0.5 6.8,9 0,3.8 -6.8,9 -4.5,0.5 -11,-5 -2.8,-5"
                       fill="url(#star-highlight)" filter="url(#star-frosted)"/>
              <!-- Top shine/gloss spot -->
              <ellipse cx="-4" cy="-9" rx="3.5" ry="2" fill="rgba(255,255,255,0.75)" transform="rotate(-20, -4, -9)"/>
              <!-- Small secondary shine -->
              <ellipse cx="4" cy="-5" rx="1.5" ry="1" fill="rgba(255,255,255,0.4)" transform="rotate(-10, 4, -5)"/>
            </g>
          </g>
        </g>

        <!-- Bottom-right leaf - slightly wider natural heart shape (rotated 240 degrees) -->
        <g class="leaf-group" data-leaf="right" transform="rotate(240, 200, 270)">
          <g class="leaf-wrapper">
            <path class="leaf sketchy" data-leaf-id="right"
              d="M200,270 C160,240 135,190 140,150 C143,120 160,95 180,90 C188,88 193,93 200,102 C207,93 212,88 220,90 C240,95 257,120 260,150 C265,190 240,240 200,270 Z"
              fill="#6dd66d" stroke="#4dbf4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Ladybug - appears on hover over right leaf, positioned inside the leaf -->
            <g class="ladybug" opacity="0" style="cursor: pointer;">
              <!-- Body -->
              <ellipse cx="180" cy="195" rx="12" ry="15" fill="#ff4444" stroke="#333" stroke-width="1.5"/>
              <!-- Head -->
              <circle cx="180" cy="183" r="6" fill="#333"/>
              <!-- Line dividing wings -->
              <line x1="180" y1="183" x2="180" y2="210" stroke="#333" stroke-width="1"/>
              <!-- Seven spots -->
              <circle cx="175" cy="190" r="2" fill="#333"/>
              <circle cx="185" cy="190" r="2" fill="#333"/>
              <circle cx="173" cy="197" r="2" fill="#333"/>
              <circle cx="187" cy="197" r="2" fill="#333"/>
              <circle cx="175" cy="204" r="2" fill="#333"/>
              <circle cx="185" cy="204" r="2" fill="#333"/>
              <circle cx="180" cy="198" r="2.5" fill="#333"/>
              <!-- Antennae -->
              <line x1="177" y1="179" x2="174" y2="175" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="183" y1="179" x2="186" y2="175" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- Center point -->
        <circle cx="200" cy="270" r="4" fill="#4dbf4d" opacity="0.6"/>
      </svg>
    </div>
  </div>
